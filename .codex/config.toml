# ADF project-scoped Codex configuration
# Codex discovers this file by walking up from cwd to git root.
# ADF keeps AGENTS.md as the Codex-facing project doc and uses CLAUDE.md only as a fallback.

project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536

# Allow bounded custom-agent nesting for ADF multi-agent workflows.
[agents]
max_depth = 2
max_concurrent = 8
